services:
  # 1. FastAPI Web Server
  - type: web
    name: fastapi-backend
    env: python
    buildCommand: "uv sync"
    startCommand: "cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: celery-redis-broker
          property: connectionString
      - key: OLLAMA_BASE_URL
        sync: false

  # 2. Celery Worker Service
  - type: worker
    name: celery-worker
    env: python
    buildCommand: "uv sync"
    startCommand: "cd backend && uv run celery -A tasks.celery_app worker --loglevel=info"
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: celery-redis-broker
          property: connectionString
      - key: OLLAMA_BASE_URL
        sync: false

  # 3. Managed Redis Broker
  - type: keyvalue
    name: celery-redis-broker
    ipAllowList: []
    plan: free